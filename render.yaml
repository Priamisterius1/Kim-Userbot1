services:
  - type: web
    name: kim-userbot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 -m userbot"
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: BOT_TOKEN
        sync: false
